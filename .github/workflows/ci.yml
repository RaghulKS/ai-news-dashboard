name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 finintel tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 finintel tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run tests
        env:
          SENTIMENT_BACKEND: lexicon
        run: |
          pytest tests/ -v --cov=finintel --cov-report=term-missing
